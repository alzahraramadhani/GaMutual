version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gamutual_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamutual
      POSTGRES_PASSWORD: gamutual_secure_password
      POSTGRES_DB: gamutual
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamutual -d gamutual"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gamutual_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamutual_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://gamutual:gamutual_secure_password@postgres:5432/gamutual
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=gamutual-prod-secret-aes256gcm-key-change-in-production
      - INSTAGRAM_PROXY=${INSTAGRAM_PROXY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: gamutual_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
