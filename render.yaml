services:
  - type: web
    name: gamutual-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_IG_MODE
        value: "false"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///gamutual.db"
